[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stair-clinical-monitor"
version = "0.1.0"
description = "Compare guideline contents-based search with fixed text windows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.72,<1",
    "beautifulsoup4>=4.14,<5",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "numpy>=2,<3",
    "scikit-learn>=1.7,<2",
    "scipy>=1.15,<2",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8.4,<10"]

[project.scripts]
stair = "stair_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
